<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mail Pal</title>
    <!-- Import DM Sans font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
    <link rel="shortcut icon" href="/images/logo.png" type="image/x-icon" />
  </head>
  <body>
    <div class="app-container">
      <!-- Overlay for blurring background -->
      <div class="overlay" id="overlay"></div>

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="logo-con">
          <img id="logo" src="/images/logo.png" alt="" />
        </div>
        <div class="compose-con">
          <button id="compose-btn">+ Compose</button>
        </div>
        <div class="pages-con">
          <ul class="pages">
            <li><img class="icons" src="/images/Inbox.png" alt="" /> Inbox</li>
            <li><img class="icons" src="/images/star.png" alt="" /> Starred</li>
            <li><img class="icons" src="/images/send.png" alt="" />Sent</li>
            <li><img class="icons" src="/images/mail.png" alt="" />Draft</li>
          </ul>
        </div>

        <div class="tip-con">
          <div class="tip">
            <h4>pal tips</h4>
            <p>press <span>C</span> anywhere to start a new message</p>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Navbar -->
        <header class="navbar">
          <div class="nav-left">
            <button class="hamburger" id="hamburger" aria-label="Toggle Menu">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M4 6H20M4 12H20M4 18H20"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="search-con">
              <img id="search-icon" src="/images/search.png" alt="" />
              <input
                placeholder="     Search mail"
                type="search"
                name="search"
                id="search-bar"
              />
            </div>
          </div>
          <div class="user-profile">user</div>
        </header>

        <!-- Page Content -->
        <section class="content-area">
          <!-- Content goes here -->
          <div class="board">
            <div class="board-info">
              <h1 id="page-name">Inbox</h1>
              <p id="date">Date</p>
            </div>

            <div class="refresh-con">
              <img id="refresh-btn" src="/images/refresh.png" alt="" />
            </div>
          </div>

          <div class="main-messages-page">
            <div class="messages-box"></div>

            <div id="compose-box" class="compose-box">
              <div class="compose-header">
                <span>New message</span>
                <button class="close-btn" aria-label="Close">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M18 6L6 18M6 6l12 12"></path>
                  </svg>
                </button>
              </div>
              <div class="compose-input-row">
                <label>To</label>
                <input type="text" placeholder="" />
                <span class="cc-bcc">Cc Bcc</span>
              </div>
              <div class="compose-input-row">
                <input type="text" placeholder="Subject" />
              </div>
              <div class="compose-body">
                <textarea
                  placeholder="Write something thoughtful..."
                ></textarea>
              </div>
              <div class="compose-footer">
                <button class="send-btn">
                  Send
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                </button>
                <button class="icon-btn attach-btn">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                    ></path>
                  </svg>
                </button>
                <div class="spacer"></div>
                <button class="icon-btn trash-btn">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path
                      d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                    ></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
