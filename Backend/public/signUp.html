<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
         <main>
            <div class="logo-container">
                   <img src="" alt="">
            </div>
            
            <div class="content-container">
                <h1>Create your account</h1>
                <p>get started with Mail pal , it"s easy and quick</p>
            </div>

            <!--form-->
            <form action="">
                <label for="username">username</label>
                <input placeholder="choose your username" type="text" name="username">
                <label for="email">email</label>
                <input placeholder="you@gmail.com" type="email" name="email">
                <label for="password">password</label>
                <input placeholder="Create a strong password" type="password" name="password">
                <label for="profile"></label>
                <input type="file" name="profile">

                <button>Sign Up -> </button>
            </form>

         </main>
</body>
</html>
